
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LISTA DE REGALOS</title>

    <meta name="description" content="Mi colección personal de regalos.">

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
</head>

<body>

    <header class="navbar">
        <a href="#" class="logo">REGALOS<span>OWEN</span></a>

        <div class="nav-label">
            COLECCION PERSONAL
        </div>
    </header>

    <main>

        <section class="hero">
            <p class="eyebrow">UNA NAVIDAD MARAVILLOSA</p>

            <h1>LISTA DE <span>REGALOS OWEN.</span></h1>

            <p class="hero-description">
                UNA PEQUEÑA COLECCION DE COSAS QUE ME GUSTARIA TENER.
            </p>

            <div class="hero-line"></div>

            <p class="collection-label">
                MI COLECCION PERSONAL
            </p>
        </section>

        <section class="catalog">

            <div class="catalog-header">

                <div>
                    <p class="section-number">01 / COLLECTION</p>
                    <h2>Mis regalos</h2>
                </div>

                <div class="search-container">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Buscar un regalo..."
                        aria-label="Buscar regalos"
                    >
                    <span>⌕</span>
                </div>

            </div>

            <div id="giftContainer" class="gift-grid">
                <!-- JavaScript agregará los regalos aquí -->
            </div>

            <p id="emptyMessage" class="empty-message" hidden>
                No encontramos ningún regalo.
            </p>

        </section>

    </main>

    <footer>
        <div class="footer-line"></div>

        <p>LISTA DE REGALOS OWEN © 2026</p>

        <span>MADE IN TEMIXCO</span>
    </footer>

    <script src="script.js"></script>

</body>
</html>
